# isola-runtime (OD-49) — exposes the FastAPI backend publicly so
# apps/isola at isola.epic.dm can call /api/auth, /api/agents,
# /api/channel/whatsapp/... and friends.
#
# Backend runs inside the isolaruntime-backend container on host port
# 8800 (compose mapping 8800:8000).
#
# This is the pre-certbot shape; after running
#   sudo certbot --nginx -d runtime.epic.dm
# certbot will add a listen 443 ssl block + convert port 80 to a
# 301 redirect, matching the bff.epic.dm shape.

server {
    server_name runtime.epic.dm;

    # Hard cap on request body — Meta media webhooks can be sizable.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /ws/chat/{agent_id} streaming.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Give LLM calls headroom — _call_agent_llm has per-model timeouts,
        # nginx's default 60s is tight for a 50-round tool-calling loop.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass_request_headers on;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/runtime.epic.dm/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/runtime.epic.dm/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = runtime.epic.dm) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name runtime.epic.dm;
    return 404; # managed by Certbot


}