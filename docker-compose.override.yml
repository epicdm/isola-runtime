# Backlog: consolidate port mapping into main compose, retire this file.
#
# 2026-04-27 (Day 4b): added environment: block for the BFF→Clawith
# dispatch path. Three vars propagate from /opt/isola-runtime/.env into
# the backend container so paperclip_client.py and the new
# /api/internal/dispatch endpoint can authenticate to Paperclip and
# accept BFF requests.
# 2026-04-29 (Day 5 Step 18): backend now attached to isola-net
