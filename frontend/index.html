<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">

<head>
  <script>
    // Phase E.2.2b — apps/isola auth bridge: copy isola_runtime_session
    // cookie (set on .isola.epic.dm by isola.epic.dm/api/runtime/bridge)
    // into localStorage so api.ts uses it as Bearer. Runs before any
    // module to beat the /login redirect on first paint.
    (function () {
      try {
        var m = document.cookie.match(/(?:^|;\s*)isola_runtime_session=([^;]+)/);
        if (m && m[1]) {
          var v = decodeURIComponent(m[1]);
          if (v && v !== localStorage.getItem('token')) {
            localStorage.setItem('token', v);
          }
        }
      } catch (e) { /* swallow — not app-blocking */ }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Isola — AI-powered front desk for Caribbean SMBs (isola-runtime, fork of Clawith)" />
  <title>Isola Runtime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
